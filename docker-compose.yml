services:
  postgres:
    image: postgres:16-alpine
    container_name: salesflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: salesflow_secure_password
      POSTGRES_DB: salesflow_crm
    ports:
      - "5432:5432"
    volumes:
      - salesflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salesflow_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:salesflow_secure_password@postgres:5432/salesflow_crm?schema=public"
      JWT_SECRET: "your_super_secret_jwt_key_salesflow"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  salesflow_pgdata:
    driver: local
