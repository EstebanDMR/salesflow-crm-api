services:
  - type: web
    name: salesflow-crm-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: salesflow-crm-db
          property: connectionString

databases:
  - name: salesflow-crm-db
    plan: free
    databaseName: salesflow_crm
    user: salesflow_user
